<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101713">
<title>Nourish — Daily Nutrition Tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c110e;color:#f1f5ef;font:15px system-ui,sans-serif}
main{max-width:32rem;padding:2rem;text-align:center}p{color:#9aa99c} .spin{width:28px;height:28px;margin:22px auto;border:3px solid #304035;border-top-color:#b8f36b;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main><div class="spin"></div><h1>Opening NOURISH</h1><p>Preparing your private nutrition tracker…</p></main>
<script>
(async()=>{
  try {
    const count=8;
    const parts=await Promise.all(Array.from({length:count},(_,i)=>{
      const n=String(i+1).padStart(2,"0");
      return fetch("./payload/part-"+n+".txt").then(r=>{if(!r.ok)throw new Error("Could not load app package (part "+n+").");return r.text();});
    }));
    const binary=Uint8Array.from(atob(parts.join("").replace(/\s/g,"")),c=>c.charCodeAt(0));
    if(!("DecompressionStream" in window)) throw new Error("This browser does not support the app's compressed delivery. Please use an updated Chrome, Edge or Safari.");
    const html=await new Response(new Blob([binary]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  } catch(error) {
    document.querySelector("main").innerHTML="<h1>Couldn't open NOURISH</h1><p>"+String(error.message||error)+"</p><p>Check your connection and reload the page. Once the app has loaded successfully, offline mode can be enabled.</p>";
  }
})();
</script>
</body>
</html>
